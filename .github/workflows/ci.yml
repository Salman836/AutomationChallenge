name: E2E

on:
  push:
    branches-ignore: ['allure'] # don't trigger on the publish branch
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Run every browser project, not just Chromium'
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
  TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
  TELENOR_BASE_URL: https://www.telenor.se
  TRELLO_BASE_URL: https://api.trello.com
  PERF_SAMPLES: 20

jobs:
  functional:
    name: functional
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.9
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps ${{ inputs.full_matrix && 'chromium firefox webkit' || 'chromium' }}

      - name: Run functional suites
        run: npx playwright test ${{ inputs.full_matrix && '--project=api --project=web-chromium --project=web-firefox --project=web-webkit' || '--project=api --project=web-chromium' }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-functional
          path: |
            playwright-report/
            test-results/
            docs/observed-behaviour.generated.md
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-functional
          path: allure-results/
          retention-days: 1
          if-no-files-found: ignore

  performance:
    name: performance (non-blocking)
    if: ${{ !cancelled() }}
    continue-on-error: true
    needs: functional
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.9
          cache: npm

      - run: npm ci

      - name: Run Trello performance suite
        run: npx playwright test --project=perf-api --workers=1

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance
          path: |
            perf-results/
            playwright-report/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-performance
          path: allure-results/
          retention-days: 1
          if-no-files-found: ignore

      - name: Publish summary
        run: cat perf-results/perf-summary.md >> "$GITHUB_STEP_SUMMARY" || true
        if: always()

  report:
    name: allure report
    needs: [functional, performance]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Collect allure results from all jobs
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Get previous report history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: allure
          path: gh-pages

      - name: Generate report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 30

      - name: Publish
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.TRELLO_TOKEN }}
          publish_branch: allure
          publish_dir: allure-history

      - name: Link to report
        run: echo "[Allure report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/)" >> "$GITHUB_STEP_SUMMARY"
