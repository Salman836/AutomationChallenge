name: E2E

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Run every browser project, not just Chromium'
        type: boolean
        default: false
      # No `run_performance` input: the performance job now runs on every trigger,
      # after the functional suite and non-blocking. A checkbox that no longer
      # gates anything would be worse than none.

concurrency:
  group: e2e-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
  TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
  TELENOR_BASE_URL: https://www.telenor.se
  TRELLO_BASE_URL: https://api.trello.com
  PERF_SAMPLES: 20

jobs:
  functional:
    name: functional
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.9
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps ${{ inputs.full_matrix && 'chromium firefox webkit' || 'chromium' }}

      - name: Run functional suites
        run: npx playwright test ${{ inputs.full_matrix && '--project=api --project=web-chromium --project=web-firefox --project=web-webkit' || '--project=api --project=web-chromium' }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-functional
          path: |
            playwright-report/
            test-results/
            docs/observed-behaviour.generated.md
          retention-days: 1
          if-no-files-found: ignore

  performance:
    name: performance (non-blocking)

    if: ${{ !cancelled() }}
    continue-on-error: true
    needs: functional
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.9
          cache: npm

      - run: npm ci

      - name: Run Trello performance suite
        run: npx playwright test --project=perf-api --workers=1

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance
          path: |
            perf-results/
            playwright-report/
          retention-days: 1
          if-no-files-found: ignore

      - name: Publish summary
        if: always()
        run: cat perf-results/perf-summary.md >> "$GITHUB_STEP_SUMMARY" || true
